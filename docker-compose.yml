# Local development database only. The app itself runs with `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaa
      POSTGRES_PASSWORD: jaa
      POSTGRES_DB: jaa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jaa -d jaa']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
